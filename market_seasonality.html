<style>
:root{
  --y25:#9b998f; --y26:#2a78d6;
  --plane:#f9f9f7; --surface:#fcfcfb;
  --ink-1:#0b0b0b; --ink-2:#52514e; --ink-muted:#898781;
  --grid:#e7e6df; --axis:#c3c2b7; --ring:rgba(11,11,11,.10);
  --band25:rgba(155,153,143,.16); --band26:rgba(42,120,214,.10);
  --up:#1b7a55; --down:#c0392b;
  --cDE:#2a78d6; --cFR:#d97b3a; --cIT:#2e7d5b; --cUK:#b0568f; --cUS:#7a5fd0;
}
*{margin:0;padding:0;box-sizing:border-box;}
body{background:var(--plane);color:var(--ink-1);font-family:system-ui,-apple-system,"Segoe UI",Roboto,"PingFang SC","Microsoft YaHei",sans-serif;}
.wrap{max-width:1200px;margin:0 auto;padding:28px 28px 64px;}
.topbar{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;flex-wrap:wrap;}
h1{font-size:22px;font-weight:700;letter-spacing:-.01em;}
.langswitch{display:inline-flex;border:1px solid var(--axis);border-radius:999px;overflow:hidden;flex-shrink:0;}
.langbtn{border:0;background:var(--surface);color:var(--ink-2);font-family:inherit;font-size:13px;padding:7px 18px;cursor:pointer;transition:all .15s;}
.langbtn.on{background:var(--ink-1);color:#fff;font-weight:600;}
.sub{font-size:13px;color:var(--ink-2);margin-top:10px;line-height:1.7;}
.region-tabs{margin-top:18px;}
.region-tabs .tab{font-size:14.5px;font-weight:600;padding:10px 28px;}
.sec{margin-top:28px;}
.sec>h2{font-size:15px;font-weight:700;display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;}
.sec>h2 small{font-size:11.5px;color:var(--ink-muted);font-weight:500;}
.findings{background:var(--surface);border:1px solid var(--ring);border-radius:14px;padding:16px 20px;margin-top:16px;}
.findings h2{font-size:14px;margin-bottom:8px;}
.findings ul{list-style:none;}
.findings li{font-size:13px;color:var(--ink-2);line-height:1.85;padding:4px 0 4px 16px;position:relative;}
.findings li::before{content:"";position:absolute;left:0;top:13px;width:6px;height:6px;border-radius:50%;background:var(--y26);}
.findings b{color:var(--ink-1);}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:14px;}
.card{background:var(--surface);border:1px solid var(--ring);border-radius:14px;padding:18px 20px 14px;min-width:0;}
.card h3{font-size:15px;font-weight:700;}
.cap{font-size:12px;color:var(--ink-muted);margin-top:3px;margin-bottom:8px;line-height:1.6;}
.chart-wrap{position:relative;height:340px;}
.card.wide{grid-column:1/-1;}
.pstat{display:flex;gap:10px;flex-wrap:wrap;margin:4px 0 10px;}
.pchip{flex:1 1 auto;min-width:190px;border:1px solid var(--grid);border-radius:8px;padding:8px 14px;font-size:12.5px;color:var(--ink-2);background:var(--plane);}
.pchip b{font-size:13px;color:var(--ink-1);margin-right:5px;}
.legend2{display:flex;gap:18px;font-size:12px;color:var(--ink-2);margin-bottom:8px;flex-wrap:wrap;}
.legend2 span{display:inline-flex;align-items:center;gap:6px;}
.sw{width:18px;height:3px;border-radius:2px;display:inline-block;}
.sw.dash{height:0;border-top:3px solid var(--y25);border-radius:0;}
.band{width:14px;height:10px;border-radius:2px;display:inline-block;}
.tabs{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap;}
.tab{padding:8px 20px;border:1px solid var(--axis);background:var(--surface);border-radius:999px;font-size:13.5px;color:var(--ink-2);cursor:pointer;font-family:inherit;transition:all .15s;}
.tab:hover{border-color:var(--ink-2);color:var(--ink-1);}
.tab.on{background:var(--y26);border-color:var(--y26);color:#fff;font-weight:600;}
.insights{display:flex;flex-direction:column;gap:8px;margin-top:2px;}
.insight{background:var(--surface);border:1px solid var(--ring);border-left:3px solid var(--y26);border-radius:8px;padding:10px 14px;font-size:13px;color:var(--ink-2);line-height:1.75;}
.insight b{color:var(--ink-1);}
table{border-collapse:collapse;width:100%;font-size:12.5px;font-variant-numeric:tabular-nums;}
th,td{padding:6px 10px;text-align:right;border-bottom:1px solid var(--grid);white-space:nowrap;}
th:first-child,td:first-child{text-align:left;}
th{color:var(--ink-muted);font-weight:600;border-bottom:1px solid var(--axis);}
tr:hover td{background:rgba(127,127,127,.06);}
.up{color:var(--up);} .down{color:var(--down);}
.tbl-scroll{overflow-x:auto;}
.tbl-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:14px;}
.tbl-grid .card{margin:0;}
.foot{font-size:11.5px;color:var(--ink-muted);line-height:1.8;margin-top:24px;}
.foot p{margin-top:4px;}
.foot b{color:var(--ink-2);}
@media(max-width:900px){.grid{grid-template-columns:1fr;}.tbl-grid{grid-template-columns:1fr;}.chart-wrap{height:320px;}
.tab{min-height:44px;padding:10px 0;text-align:center;}
.findings li,.insight{font-size:14px;}
.sub,.cap{font-size:13px;}
.tabs{display:grid;grid-template-columns:1fr 1fr;gap:8px;}}
</style>
</head>

  <div class="foot" data-i18n-html="foot"></div>
</div>

/* ---------- 状态与通用 ---------- */
const state={lang:'zh', region:'EU', cc:'DE'};
const T=()=>I18N[state.lang];
const MONLAB=()=>state.lang==='zh'?MON_EN.map((_,i)=>(i+1)+'月'):MON_EN;
const NAME=c=>M.names[c][state.lang];
const REG=()=>M.regions[state.region];
const ORDER=()=>REG().order;
const CD=(c)=>REG().countries[c];
const CS={DE:'--cDE',FR:'--cFR',IT:'--cIT',UK:'--cUK',US:'--cUS'};
const $=id=>document.getElementById(id);
const cssv=n=>getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const C25=cssv('--y25'), C26=cssv('--y26'), UP=cssv('--up'), DOWN=cssv('--down');
const GRID=cssv('--grid'), MUT=cssv('--ink-muted'), I2=cssv('--ink-2'), AXIS=cssv('--axis');
const B25=cssv('--band25'), B26=cssv('--band26');
const CCOL=c=>cssv(CS[c]);
const fmtN=n=>n==null?'—':Math.round(n).toLocaleString('en-US');
const fmtNat=(v,c)=>v==null?'—':(M.nat[c]+Math.round(v).toLocaleString('en-US'));
const fmtEu=v=>v==null?'—':'€'+Math.round(v).toLocaleString('en-US');
const pctS=v=>v==null?'—':(v>=0?'+':'')+v.toFixed(1)+'%';
const kfmt=v=>v>=1000?(v/1000).toFixed(1)+'k':v;
const pct=(a,b)=>a==null||b==null||b===0?'—':(a-b)/b*100;
const pctCell=v=>v==='—'?'<td>—</td>':`<td class="${v>=0?'up':'down'}">${v>=0?'+':''}${v.toFixed(1)}%</td>`;
const axisBase={grid:{color:GRID,drawTicks:false},axisLine:{show:false},axisTick:{show:false}};
/* 同比坐标窗口：英国 2025-01 仅 14 台，致 2026-01 同比 +2728.6%，不截断会压平其余折线 */
const YCAP=300, YFLOOR=-100;
const clipY=arr=>arr.map(v=>v==null?null:Math.max(YFLOOR,Math.min(YCAP,v)));
let charts=[];
function mkChart(el,opt){ if(!window.echarts||!el) return null; const ch=echarts.init(el); ch.setOption(opt); charts.push(ch); return ch; }
function killAll(){ charts.forEach(ch=>ch&&ch.dispose()); charts=[]; }

    tooltip:{trigger:'axis',axisPointer:{type:'line'},

      needCap?{min:YFLOOR,max:YCAP}:{})],
    series:[
      {name:isQ?t.s25q:t.s25p,type:'line',data:s25,symbol:'circle',symbolSize:3.5,lineStyle:{width:2,color:C25,type:'dashed'},itemStyle:{color:C25},
       markArea:{silent:true,itemStyle:{color:B25},data:[[{xAxis:labs[d.band25[0]]},{xAxis:labs[d.band25[1]]}]]}},

         label:{show:true,formatter:t.capLabel,color:MUT,fontSize:9,position:'insideEndTop'}}]}}:{})

function buildTable(kind,code){
  const t=T(), d=CD(code), isQ=kind==='q';
  const a25=isQ?d.q25:d.p25, a26=isQ?d.q26:d.p26, labs=MONLAB();
  let h=`<tr><th>${t.thMonth}</th><th>${t.th2025}</th><th>${t.thMoM}</th><th>${t.th2026}</th><th>${t.thMoM}</th><th>${t.thYoY}</th></tr>`;
  for(let i=0;i<12;i++){
    const v25=a25[i], v26=a26[i];
    const m25=i>0?pct(v25,a25[i-1]):'—';
    const m26=(i>0&&v26!=null&&a26[i-1]!=null)?pct(v26,a26[i-1]):'—';
    const yoy=v26!=null?pct(v26,v25):'—';
    const cell=v=>isQ?fmtN(v):(v==null?'—':fmtNat(v,code));
    h+=`<tr><td>${labs[i]}</td><td>${cell(v25)}</td>${pctCell(m25)}<td>${cell(v26)}</td>${pctCell(m26)}${pctCell(yoy)}</tr>`;
  }
  return h;
}

        <div class="cap">${t.capQ}</div>
        <div class="legend2">${legendHTML(t)}</div>
        <div class="chart-wrap"><div id="cQty" style="width:100%;height:100%"></div></div>
      </div>
      <div class="card">
        <h3>${t.cPriceT(NAME(code),M.nat[code])}</h3>
        <div class="cap">${priceCap}</div>
        <div class="legend2">${legendHTML(t)}</div>
        <div class="chart-wrap"><div id="cPrice" style="width:100%;height:100%"></div></div>
      </div>
    </div>
    <div class="tbl-grid">
      <div class="card"><h3>${t.tQtyT}</h3><div class="tbl-scroll"><table id="tQty"></table></div></div>
      <div class="card"><h3>${t.cPriceTbl(M.nat[code])}</h3><div class="tbl-scroll"><table id="tPrice"></table></div></div>
    </div>`;
  mkChart($('cQty'),countryOpt(code,'q'));
  mkChart($('cPrice'),countryOpt(code,'p'));
  $('tQty').innerHTML=buildTable('q',code);
  $('tPrice').innerHTML=buildTable('p',code);
}

/* ---------- 美国区 ---------- */
function renderUS(){
  const t=T();
  $('usLegendQ').innerHTML=legendHTML(t);
  $('usLegendP').innerHTML=legendHTML(t);
  mkChart($('cUSq'),countryOpt('US','q'));
  mkChart($('cUSp'),countryOpt('US','p'));
  $('tUSq').innerHTML=buildTable('q','US');
  $('tUSp').innerHTML=buildTable('p','US');
}

/* ---------- 总渲染 ---------- */
function applyI18n(){
  const t=T();
  document.documentElement.lang=state.lang==='zh'?'zh-CN':'en';
  document.title=t.title;
  document.querySelectorAll('[data-i18n]').forEach(el=>{
    const k=el.dataset.i18n; if(t[k]!=null) el.textContent=t[k];
  });
  document.querySelectorAll('[data-i18n-html]').forEach(el=>{
    const k=el.dataset.i18nHtml; if(t[k]!=null) el.innerHTML=t[k];
  });
}
function render(){
  killAll();
  applyI18n();
  // 地区显隐
  $('regEU').style.display=state.region==='EU'?'':'none';
  $('regUS').style.display=state.region==='US'?'':'none';
  document.querySelectorAll('#regionTabs .tab').forEach(b=>b.classList.toggle('on',b.dataset.r===state.region));
  document.querySelectorAll('.langbtn').forEach(b=>b.classList.toggle('on',b.dataset.l===state.lang));
  // 结论
  $('findingsEU').innerHTML=M.regions.EU.findings[state.lang].map(s=>'<li>'+s+'</li>').join('');
  $('findingsUS').innerHTML=M.regions.US.findings[state.lang].map(s=>'<li>'+s+'</li>').join('');
  if(state.region==='EU'){
    // 分国 tab
    $('tabs').innerHTML=ORDER().map(c=>`<button class="tab ${c===state.cc?'on':''}" data-c="${c}">${NAME(c)} ${c}</button>`).join('');
    document.querySelectorAll('#tabs .tab').forEach(btn=>{
      btn.addEventListener('click',()=>{state.cc=btn.dataset.c;render();});
    });
    renderCompare();
    renderCountry(state.cc);
  }else{
    renderUS();
  }
}

document.querySelectorAll('.langbtn').forEach(btn=>{
  btn.addEventListener('click',()=>{state.lang=btn.dataset.l;render();});
});
document.querySelectorAll('#regionTabs .tab').forEach(btn=>{
  btn.addEventListener('click',()=>{
    state.region=btn.dataset.r;
    if(state.region==='US') state.cc='US'; else if(!M.regions.EU.order.includes(state.cc)) state.cc='DE';
    render();
  });
});
window.addEventListener('resize',()=>charts.forEach(ch=>ch&&ch.resize()));
render();
</script>
</body>
</html>
